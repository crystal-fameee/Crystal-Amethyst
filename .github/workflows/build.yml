name: Build Crystal-Amethyst

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Check JAR
        run: |
          echo "Built files:"
          ls -lah target/
          test -f target/Crystal-Amethyst-1.2.0.jar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Amethyst-1.2.0
          path: target/Crystal-Amethyst-1.2.0.jar
          if-no-files-found: error
